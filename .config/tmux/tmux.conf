#referer {{{
# https://github.com/yuroyoro/dotfiles/blob/master/.tmux.conf
# http://qiita.com/succi0303/items/cb396704493476373edf
# http://kanjuku-tomato.blogspot.jp/2014/02/tmux.html
#}}}
# Claude {{{
set -g allow-passthrough on
set -as terminal-features 'xterm*:extkeys:RGB'
#}}}
#base-terminal {{{
set  -g  automatic-rename off
set  -g  base-index 1
set  -gs escape-time 0
set  -g  history-limit 10000
set  -g  default-shell $SHELL
set  -g  default-command "$SHELL"
setw -g  mode-keys vi
setw -g  pane-base-index 1
set  -g  status-interval 60
#}}}
#display-base {{{
set  -g default-terminal 'tmux-256color'
set  -g mouse on
set  -g pane-border-style fg='colour245'
set  -g pane-active-border-style fg='white',bg='black'
# pane background (アクティブペインだけ若干グレー寄せ)
set  -g window-style        bg=default
set  -g window-active-style bg=colour237
setw -g mode-style fg='black',bg='white'
setw -g window-status-current-style fg='black',bg='blue','bold'
# Pane title 表示 (cw/cwr/cwp で自動設定される)
# Claude 起動で pane_title が上書きされるため、@cw_title (pane-scope user option) を優先表示
set  -g pane-border-status top
set  -g pane-border-format ' #[fg=colour39,bold]#{?#{@cw_title},#{@cw_title},#{pane_title}}#[default] '
#}}}
#display-status line {{{
set  -g status-style fg='white','dim',bg='colour234'
set  -g status-left-length 32
set  -g status-right-length 150
set  -g status-position top
set  -g status-left  ''
set  -g status-right ''
setw -g window-status-activity-style 'bold'
setw -g window-status-format '#[fg=white,bg=colour234] #{b:pane_current_path} '
setw -g window-status-current-format '#[fg=colour234,bg=colour39] #{b:pane_current_path} #[fg=colour39,bg=colour234,nobold]'
#}}}
#mapping {{{
# prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix
# copy
unbind -T copy-mode-vi Enter
bind -T copy-mode-vi v send -X begin-selection
unbind -T copy-mode-vi Space
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'reattach-to-user-namespace pbcopy'
unbind -T copy-mode-vi 1
bind -T copy-mode-vi 1 send -X back-to-indentation
unbind -T copy-mode-vi 0
bind -T copy-mode-vi 0 send -X end-of-line
# window
unbind c
bind -n C-t new-window
unbind d
bind C-q detach
unbind w
bind C-l list-windows
# window change
unbind n
unbind p
bind -n C-s next-window # OR previous-window
# window move
bind C-p swap-window -t -1
bind C-n swap-window -t +1
# Claude layout: 左35%メイン + 右65%(2x2)
# split-window のたびに pane-index が空間順で振り直されるため
# select-pane は番号 (-t N) ではなく方向 (-U/-D) で指定する
bind C-c \
  split-window -h -l 65% \; \
  select-pane -t 1
  # 画面レイアウト調整中
  #split-window -v -l 50% \; \
  #select-pane -U \; \
  #split-window -v -l 50% \; \
  #select-pane -D \; \
  #split-window -v -l 50% \; \
# pane 1 (Claudeメイン) と現在ペインを入れ替え
bind C-x swap-pane -s 1 -d
# scroll
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"
# split / vertical
unbind %
unbind v
bind -n C-h split-window -h
unbind '"'
unbind s
bind -n C-_ split-window -v
unbind !
bind C-k kill-pane
unbind +
bind -r K resize-pane -U 5
unbind -
bind -r J resize-pane -D 5
unbind >
bind -r H resize-pane -R 5
unbind <
bind -r L resize-pane -L 5
bind C-w select-pane -t :.+
# rename
unbind ,
# reload
bind C-r source-file $HOME/.config/tmux/tmux.conf\; display-message 'Reloaded.'
#}}}
